<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hamster Hustle - Tap to Earn</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
        }
        /* Top Header Info */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }
        .profile-card {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1c1f24;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid #2d3139;
        }
        .avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ff9d00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .level-title {
            font-size: 11px;
            color: #8b8e99;
            font-weight: 600;
        }
        .level-name {
            font-size: 13px;
            font-weight: 700;
            color: #f3ba2f;
        }

        /* 3 Stat Boxes */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #15181c;
            border: 1px solid #23272e;
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
        }
        .stat-label {
            font-size: 10px;
            color: #8b8e99;
            font-weight: 600;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 13px;
            font-weight: 800;
            color: #55f32f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-top: 3px;
        }

        /* Main Score Display */
        .score-section {
            text-align: center;
            margin: 10px 0;
        }
        .main-score {
            font-size: 38px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .coin-icon-large {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
            font-size: 20px;
        }

        /* Hamster Tap Button */
        .tap-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }
        .circle-outer {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(243, 186, 47, 0.15) 0%, rgba(0,0,0,0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(243, 186, 47, 0.3);
        }
        .circle-inner {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1e2229, #13151b);
            border: 4px solid #f3ba2f;
            box-shadow: 0 0 25px rgba(243, 186, 47, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease-out;
            position: relative;
        }
        .circle-inner:active {
            transform: scale(0.93);
        }
        .hamster-avatar {
            font-size: 110px;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5));
            pointer-events: none;
        }

        /* Floating +1 Text */
        .floating-num {
            position: absolute;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #f3ba2f;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }

        /* Energy & Booster Bar */
        .bottom-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            margin-bottom: 15px;
        }
        .energy-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }
        .boost-btn {
            background: linear-gradient(90deg, #ff9000, #ff5500);
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            color: #ffffff;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(255, 85, 0, 0.4);
        }

        /* Bottom Tab Navigation Bar */
        .nav-bar {
            background: #15181c;
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 6px;
            border: 1px solid #23272e;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 0;
            color: #8b8e99;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
        }
        .nav-item.active {
            background: #1c2026;
            color: #ffffff;
            border: 1px solid #2d323b;
        }
        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Header / Level Info -->
    <div>
        <div class="top-bar">
            <div class="profile-card">
                <div class="avatar-small">🐹</div>
                <div>
                    <div class="level-title">CEO Rank</div>
                    <div class="level-name" id="rankName">Grandmaster 3/10</div>
                </div>
            </div>
            <div class="profile-card">
                <span style="font-size:12px; color:#8b8e99;">Exchange:</span>
                <span style="font-size:12px; font-weight:800; color:#ffffff;">Binance 🟡</span>
            </div>
        </div>

        <!-- 3 Stat Display Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Earn per tap</div>
                <div class="stat-value" style="color:#ffd700;">🤝 +<span id="tapPower">1</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Coins to level up</div>
                <div class="stat-value" style="color:#00e5ff;">🎯 <span id="nextLevel">5K</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Profit per hour</div>
                <div class="stat-value" style="color:#55f32f;">💰 +<span id="pPH">1.2K</span></div>
            </div>
        </div>
    </div>

    <!-- Main Balance Display -->
    <div class="score-section">
        <div class="main-score">
            <div class="coin-icon-large">🪙</div>
            <span id="scoreDisplay">0</span>
        </div>
    </div>

    <!-- Tap Character Button -->
    <div class="tap-area">
        <div class="circle-outer">
            <div class="circle-inner" id="tapButton">
                <div class="hamster-avatar">🐹</div>
            </div>
        </div>
    </div>

    <!-- Energy and Boost Button -->
    <div>
        <div class="bottom-info">
            <div class="energy-box">
                ⚡ <span id="energy">500</span> / <span id="maxEnergy">500</span>
            </div>
            <button class="boost-btn" id="boostBtn">
                🚀 Boost Energy
            </button>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-item active">
                <div class="nav-icon">🐹</div>
                <span>Exchange</span>
            </div>
            <div class="nav-item" id="mineTab">
                <div class="nav-icon">⛏️</div>
                <span>Mine</span>
            </div>
            <div class="nav-item" id="friendsTab">
                <div class="nav-icon">👥</div>
                <span>Friends</span>
            </div>
            <div class="nav-item" id="earnTab">
                <div class="nav-icon">🪙</div>
                <span>Earn</span>
            </div>
            <div class="nav-item">
                <div class="nav-icon">💎</div>
                <span>Airdrop</span>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let score = parseInt(localStorage.getItem('hamster_score')) || 0;
        let energy = parseInt(localStorage.getItem('hamster_energy')) || 500;
        let maxEnergy = 500;
        let tapPower = 1;
        let passiveIncome = parseInt(localStorage.getItem('hamster_pPH')) || 0;

        // UI Elements
        const scoreDisplay = document.getElementById('scoreDisplay');
        const energyDisplay = document.getElementById('energy');
        const tapButton = document.getElementById('tapButton');
        const tapArea = document.querySelector('.tap-area');
        const pPHEl = document.getElementById('pPH');

        // Audio Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTapSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function updateUI() {
            scoreDisplay.innerText = score.toLocaleString();
            energyDisplay.innerText = energy;
            pPHEl.innerText = passiveIncome > 1000 ? (passiveIncome/1000).toFixed(1) + 'K' : passiveIncome;
        }

        // Tap Handler with Floating Text
        tapButton.addEventListener('click', (e) => {
            if (energy >= tapPower) {
                score += tapPower;
                energy -= tapPower;

                playTapSound();
                if (navigator.vibrate) navigator.vibrate(15);

                // Spawn floating +1
                const rect = tapArea.getBoundingClientRect();
                const floatEl = document.createElement('div');
                floatEl.className = 'floating-num';
                floatEl.innerText = '+' + tapPower;
                floatEl.style.left = (e.clientX - rect.left - 10) + 'px';
                floatEl.style.top = (e.clientY - rect.top - 20) + 'px';
                tapArea.appendChild(floatEl);

                setTimeout(() => floatEl.remove(), 800);

                updateUI();
                localStorage.setItem('hamster_score', score);
                localStorage.setItem('hamster_energy', energy);
            }
        });

        // Boost Energy
        document.getElementById('boostBtn').addEventListener('click', () => {
            energy = maxEnergy;
            updateUI();
            alert("Energy Fully Refilled! 🚀");
        });

        // Mine Card Purchase (Passive Income)
        document.getElementById('mineTab').addEventListener('click', () => {
            let cost = 100;
            if (score >= cost) {
                score -= cost;
                passiveIncome += 250;
                localStorage.setItem('hamster_pPH', passiveIncome);
                updateUI();
                alert("Purchased Mining Card! Profit Per Hour increased +250/hr!");
            } else {
                alert("Need at least 100 coins to buy a Mining Upgrade!");
            }
        });

        // Task Tab
        document.getElementById('earnTab').addEventListener('click', () => {
            score += 1000;
            updateUI();
            alert("Daily Check-in Claimed! +1,000 Coins 🪙");
        });

        // Passive Income Loop (Every second)
        setInterval(() => {
            if (passiveIncome > 0) {
                score += Math.ceil(passiveIncome / 3600);
                updateUI();
            }
        }, 1000);

        // Energy Regen
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
        }, 1500);

        updateUI();
    </script>
</body>
</html>
